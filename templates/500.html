{% extends "base.html" %}

{% block title %}Internal Server Error - KitabKosh{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-danger mb-3">500</h1>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4" style="max-width: 480px; margin: 0 auto;">
            Something unexpected occurred on our end. Please try refreshing or return to the bookstore homepage.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4">
                <i class="fa-solid fa-house me-2"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
