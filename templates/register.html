{% extends "base.html" %}

{% block title %}Register Account - KitabKosh{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5">
                <div class="text-center mb-4">
                    <span class="brand-icon fs-1"><i class="fa-solid fa-user-plus"></i></span>
                    <h3 class="fw-bold mt-2">Create an Account</h3>
                    <p class="text-muted small">Join KitabKosh to buy textbooks & track deliveries</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label small fw-semibold text-muted">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="e.g. Rahul Verma" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="student@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-muted">Password (min 6 characters)</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" minlength="6" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-semibold text-muted">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock-open text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" minlength="6" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold mb-3">
                        Register Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none text-primary">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
